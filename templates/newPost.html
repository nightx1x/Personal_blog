<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Post</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #2c2c2c; 
      font-family: Arial, sans-serif;
    }
    .card {
      width: 450px;           
      padding: 2rem;   
      text-align: center;
      background: #2a2b38;
      border-radius: 12px;    
      box-shadow: 0 12px 32px rgba(0,0,0,0.35);
    }
    .field {
      margin-top: 1rem;
      display: flex;
      align-items: center;
      gap: .5em;
      background-color: #1f2029;
      border-radius: 4px;
      padding: .5em 1em;
    }
    .input-field {
      background: none;
      border: none;
      outline: none;
      width: 100%;
      color: #d3d3d3;
      font-size: 1em;
    }
    .textarea-field {
      width: 100%;
      background: none;
      border: none;
      outline: none;
      color: #d3d3d3;
      resize: none;
      font-size: 1em;
      height: 120px;
    }
    .title {
      margin-bottom: 1rem;
      font-size: 1.5em;
      font-weight: 500;
      color: #f5f5f5;
    }
    .btn {
      margin-top: 1.5rem;
      width: 100%;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      font-size: .9em;
      text-transform: uppercase;
      padding: 0.8em;
      background-color: #ffeba7;
      color: #5e6681;
      box-shadow: 0 8px 24px 0 rgb(255 235 167 / 20%);
      transition: all .3s ease-in-out;
      cursor: pointer;
    }
    .btn:hover {
      background-color: #5e6681;
      color: #ffeba7;
      box-shadow: 0 8px 24px 0 rgb(16 39 112 / 20%);
    }
  </style>
</head>
<body>
  <div class="card">
    <h4 class="title">New Post</h4>
    <form action="/new" method="POST">
      <div class="field">
        <input class="input-field" type="text" id="title" name="title" placeholder="Enter post title" required>
      </div>
      <div class="field">
        <input class="input-field" type="date" id="date" name="date" required>
      </div>
      <div class="field" style="flex-direction: column; align-items: flex-start;">
        <textarea class="textarea-field" id="content" name="content" placeholder="Write your post content here..." required></textarea>
      </div>
      <button class="btn" type="submit">Publish</button>
    </form>
  </div>
</body>
</html>
