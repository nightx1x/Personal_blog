<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Posts</title>
<style>
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  background-color: #2c2c2c; 
  font-family: Arial, sans-serif;
  padding: 20px 0;
}

.card {
  width: 350px;           
  padding: 2rem 1.5rem;   
  margin-bottom: 20px;
  text-align: left;
  background: #2a2b38;
  border-radius: 12px;    
  box-shadow: 0 12px 32px rgba(0,0,0,0.35);
  color: #f5f5f5;
}

.title {
  font-size: 1.3em;
  font-weight: bold;
  margin-bottom: 10px;
}

.content {
  font-size: 1em;
  color: #d3d3d3;
  margin-bottom: 10px;
}

.date {
  font-size: 0.8em;
  color: #aaa;
  text-align: right;
}

.btn {
 margin: 0.5rem 0.25rem;
 border: none;
 border-radius: 4px;
 font-weight: bold;
 font-size: .8em;
 text-transform: uppercase;
 padding: 0.5em 1em;
 background-color: #ffeba7;
 color: #5e6681;
 box-shadow: 0 8px 24px 0 rgb(255 235 167 / 20%);
 transition: all .3s ease-in-out;
 cursor: pointer;
}

.btn:hover {
 background-color: #5e6681;
 color: #ffeba7;
 box-shadow: 0 8px 24px 0 rgb(16 39 112 / 20%);
}

.btn-delete {
  background-color: #e74c3c;
  color: #fff;
}

.btn-delete:hover {
  background-color: #c0392b;
}
</style>
</head>
<body>

<h1 class="title" style="text-align:center; color:#f5f5f5; margin-bottom:20px;">Posts</h1>

{{range .}}
<div class="card">
  <div class="title">{{.Title}}</div>
  <div class="content">{{.Content}}</div>
  <div class="date">{{.Date}}</div>
</div>
{{else}}
<div>
  <div class="content">No posts found.</div>
</div>
{{end}}

</body>
</html>
