<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Error</title>
<style>
body {
  margin: 0;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background-color: #2c2c2c;
  font-family: Arial, sans-serif;
}

.card {
  width: 350px;
  padding: 2.5rem 2rem;
  text-align: center;
  background: #2a2b38;
  border-radius: 12px;
  box-shadow: 0 12px 32px rgba(0,0,0,0.35);
  color: #f5f5f5;
}

.title {
  font-size: 1.5em;
  font-weight: 500;
  margin-bottom: 1.5rem;
}

.btn {
  margin: 1rem 0;
  border: none;
  border-radius: 4px;
  font-weight: bold;
  font-size: .8em;
  text-transform: uppercase;
  padding: 0.6em 1.2em;
  background-color: #ffeba7;
  color: #5e6681;
  box-shadow: 0 8px 24px 0 rgb(255 235 167 / 20%);
  transition: all .3s ease-in-out;
  cursor: pointer;
}

.btn:hover {
  background-color: #5e6681;
  color: #ffeba7;
  box-shadow: 0 8px 24px 0 rgb(16 39 112 / 20%);
}

</style>
</head>
<body>
<div class="card">
  <div class="title">Invalid Credentials</div>
  <button class="btn" onclick="window.location.href='/login'">Try Again</button>
</div>
</body>
</html>
